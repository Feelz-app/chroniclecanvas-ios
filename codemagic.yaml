workflows:
  ios-testflight:
    name: Chronicle Canvas iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.chroniclecanvas.app"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chroniclecanvas.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          npm run cap:sync
      - name: Apply App Store signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
